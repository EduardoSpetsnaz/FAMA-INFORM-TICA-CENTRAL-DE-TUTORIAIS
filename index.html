<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#15385f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fama Informática | Central de Tutoriais</title>
<style>
:root{
  --navy:#15385f;
  --blue:#1685ed;
  --bg:#080808;
  --wrapbg:#050505;
  --panel:#101010;
  --hover:#171717;
  --line:#292929;
  --muted:#c7c7c7;
  --text:#f4f4f4;
  --input:#fff;
  --inputtext:#222;
  --danger:#e5484d;
  --fs:14px;
  --r:8px;
  --font:Arial,Helvetica,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="light"]{
  --bg:#eef1f5;--wrapbg:#fff;--panel:#f6f8fb;--hover:#eaf0f7;--line:#d9e0ea;--muted:#4a5565;--text:#111827;color-scheme:light
}
@media(prefers-color-scheme:light){
  :root:not([data-theme]){--bg:#eef1f5;--wrapbg:#fff;--panel:#f6f8fb;--hover:#eaf0f7;--line:#d9e0ea;--muted:#4a5565;--text:#111827;color-scheme:light}
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.4}

.wrap{width:min(100%,920px);margin:22px auto;border:1px solid var(--line);border-radius:calc(var(--r)*2);overflow:hidden;background:var(--wrapbg)}
header{background:var(--navy);padding:16px 18px 14px;color:#f4f4f4}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:13px;min-width:0}
.logo{min-width:38px;height:38px;padding:0 6px;border-radius:var(--r);background:#fff;color:var(--navy);display:grid;place-items:center;font-size:20px;font-weight:bold;flex:none}
#brandName{font-size:1.15em;font-weight:700;line-height:1.2}
#brandSub{font-size:.72em;margin-top:2px;letter-spacing:.2px;opacity:.9}
h1{font-size:1.45em;margin:0 0 6px;line-height:1.25}
header p{margin:0 0 11px;font-size:.93em;color:#e4edf7}

.search{height:44px;background:var(--input);border-radius:var(--r);display:flex;align-items:center;padding:0 12px;gap:9px;color:#6b7280}
.search input{border:0;outline:0;width:100%;font:inherit;color:var(--inputtext);background:transparent}

main{padding:16px 14px 22px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}
.section-title,.tutorials h2{font-size:1.05em;font-weight:700;margin:0}

.categories{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.category{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;min-height:70px;transition:background .15s,border-color .15s;user-select:none}
.category:hover,.category.active{background:var(--hover);border-color:var(--line)}
.category:active{transform:scale(.99)}
.ico{font-size:22px;line-height:1;flex:none;margin-top:1px}
.category h3{font-size:1em;margin:0 0 4px}
.category p{font-size:.86em;color:var(--muted);margin:0;line-height:1.35}

.tutorials{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.tutorial-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tutorial{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px;display:flex;gap:11px;align-items:center;cursor:pointer;color:inherit;text-align:left;font:inherit;width:100%;min-height:64px;transition:border-color .15s,transform .1s}
.tutorial:hover{border-color:var(--blue)}
.tutorial:active{transform:scale(.99)}
.play{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none;font-size:13px}
.tutorial .info{min-width:0;flex:1}
.tutorial strong{font-size:.95em;display:block;margin-bottom:4px;line-height:1.3}
.tutorial small{color:var(--muted);font-size:.82em;display:block}
.msg{color:var(--muted);padding:12px 10px;text-align:center}

.btn{background:var(--blue);color:#fff;border:0;border-radius:var(--r);padding:10px 15px;font:inherit;font-weight:700;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.small{padding:7px 11px;font-size:.86em;min-height:36px}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.6;cursor:wait}
header .btn.ghost{color:#fff;border-color:#ffffff66}

footer{border-top:1px solid var(--line);padding:14px 16px;color:var(--muted);font-size:.82em;text-align:center}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--wrapbg);color:var(--text);padding:0;width:min(94vw,680px);max-height:92dvh;font-family:var(--font);overflow-y:auto}
dialog::backdrop{background:#000b;backdrop-filter:blur(2px)}
.dlg{padding:18px}
.dlg h3{margin:0 0 12px;font-size:1.15em}
.dlg label{display:block;font-size:.88em;color:var(--muted);margin:12px 0 5px}
.dlg input[type=text],.dlg input[type=url],.dlg input[type=file],.dlg select,.dlg textarea{width:100%;padding:10px 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;min-height:42px}
.dlg input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:3px}
.dlg textarea{min-height:76px;resize:vertical}
.dlg video,.dlg iframe{width:100%;background:#000;border-radius:var(--r);border:0}
.dlg video{max-height:60dvh}
.video-frame{position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);background:#000}
.video-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{flex:1;min-width:105px;white-space:nowrap}
.tabs .on{background:var(--blue);color:#fff;border-color:var(--blue)}

.catrow{display:grid;grid-template-columns:54px 1fr 1.4fr auto;gap:6px;margin-top:8px;align-items:center}
.catrow input{width:100%;padding:9px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;min-height:40px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.status{font-size:.88em;margin-top:10px;color:var(--muted)}.status.err{color:var(--danger)}
[hidden]{display:none!important}

.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.gbox{width:min(100%,390px);background:var(--wrapbg);border:1px solid var(--line);border-radius:calc(var(--r)*2);padding:24px 20px;text-align:center}
.gbox label{display:block;text-align:left;font-size:.88em;color:var(--muted);margin:12px 0 5px}
.gbox input{width:100%;padding:11px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;min-height:44px}
.gbox .logo{margin:0 auto 12px;background:var(--navy);color:#fff;width:48px;height:48px}

.hbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:.86em}
.rowr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sug{position:absolute;left:0;right:0;top:48px;z-index:20;background:var(--wrapbg);color:var(--text);border:1px solid var(--line);border-radius:var(--r);max-height:320px;overflow:auto;box-shadow:0 10px 28px #0008}
.sugi{display:flex;gap:11px;align-items:center;padding:11px 12px;cursor:pointer;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left}
.sugi:last-child{border-bottom:0}
.sugi:hover,.sugi.on{background:var(--hover)}
.sugi small{color:var(--muted)}
.mini{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--text);font:inherit;width:190px;min-height:40px}
.chead{display:flex;gap:12px;align-items:center;margin:14px 0 6px}
.urow{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:8px;flex-wrap:wrap}

/* Otimizações exclusivas para telas Mobile */
@media(max-width:640px){
  .wrap{margin:0;border-radius:0;min-height:100dvh;border:0;display:flex;flex-direction:column}
  main{flex:1;padding:16px 12px 24px}
  header{padding:14px 14px 16px}
  .top{flex-direction:column;align-items:stretch;gap:8px}
  .brand{margin-bottom:4px}
  .hbar{justify-content:space-between;width:100%;padding-top:6px;border-top:1px solid #ffffff22}
  #who{font-size:.9em;opacity:.9}
  h1{font-size:1.32em}

  /* Evita zoom automático no iOS/Android ao focar nos campos */
  input,select,textarea{font-size:16px!important}

  /* Empilha barra de título e pesquisa de categorias */
  #catSection .row{flex-direction:column;align-items:stretch;gap:10px}
  #catSection .rowr{width:100%}
  #catSearch{flex:1;width:100%}

  /* Grade de categorias em 1 coluna estilo card nativo */
  .categories{grid-template-columns:1fr;gap:8px}
  .category{background:var(--panel);border-color:var(--line);padding:12px 14px;min-height:60px;align-items:center}

  /* Lista de tutoriais em 1 coluna */
  .tutorial-list,.grid2{grid-template-columns:1fr;gap:10px}

  /* Modais estilo Bottom Sheet (gaveta inferior) */
  dialog{
    margin:auto 0 0 0;
    width:100vw;
    max-width:100vw;
    max-height:92dvh;
    border-radius:18px 18px 0 0;
    border-bottom:0;
    border-left:0;
    border-right:0;
    padding-bottom:env(safe-area-inset-bottom,12px);
  }
  .dlg{padding:18px 16px}
  .actions{flex-direction:column-reverse;gap:8px}
  .actions .btn{width:100%;min-height:44px}
  .catrow{grid-template-columns:52px 1fr auto}
  .catrow .cd{grid-column:1/-1;order:5}
  .urow .rowr{width:100%;margin-top:6px}
  .urow .rowr .btn{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div class="brand">
      <div class="logo" id="logo">▣</div>
      <div><div id="brandName"></div><div id="brandSub"></div></div>
    </div>
    <div class="hbar">
      <span id="who"></span>
      <div style="display:flex;gap:6px">
        <button class="btn ghost small" id="cfgBtn" type="button" hidden>⚙ Configurações</button>
        <button class="btn ghost small" id="outBtn" type="button" hidden>Sair</button>
      </div>
    </div>
  </div>
  <h1 id="h1"></h1><p id="hp"></p>
  <div style="position:relative">
    <label class="search">
      <span>⌕</span>
      <input id="search" type="search" placeholder="Pesquisar vídeo ou tutorial..." aria-label="Pesquisar tutorial" autocomplete="off">
    </label>
    <div id="sug" class="sug" hidden></div>
  </div>
</header>

<main>
  <div id="catSection">
    <div class="row">
      <h2 class="section-title">Categorias de tutoriais</h2>
      <div class="rowr">
        <input type="search" id="catSearch" class="mini" placeholder="Filtrar categoria..." aria-label="Pesquisar categoria">
        <button class="btn small" id="newCatBtn" type="button" hidden>+ Nova</button>
      </div>
    </div>
    <div class="categories" id="categories"></div>
  </div>

  <div id="catHead" hidden>
    <button class="btn ghost small" id="backBtn" type="button">← Voltar às categorias</button>
    <div class="chead">
      <span class="ico" id="chIcon" style="font-size:32px"></span>
      <div><h2 id="chName" style="margin:0;font-size:1.2em"></h2><p id="chDesc" class="status" style="margin:4px 0 0"></p></div>
    </div>
  </div>

  <div class="tutorials">
    <div class="row">
      <h2 id="tutTitle">Últimos tutoriais</h2>
      <button class="btn small" id="addBtn" type="button" hidden>+ Enviar vídeo</button>
    </div>
    <div class="tutorial-list" id="list"></div>
    <div class="msg" id="msg">Carregando tutoriais…</div>
  </div>
</main>
<footer id="footer"></footer>
</div>

<div class="gate" id="gate"><div class="gbox">
  <div class="logo" id="gLogo">▣</div><h3 id="gTitle" style="margin:0 0 6px">Central de Tutoriais</h3>
  <p class="status" id="gInfo">Carregando…</p>
  <div id="gForm" hidden>
    <label for="gUser">Usuário</label><input type="text" id="gUser" autocomplete="username" autocapitalize="none">
    <div id="gNameW" hidden><label for="gName">Seu nome</label><input type="text" id="gName" maxlength="60"></div>
    <label for="gPass">Senha</label><input type="password" id="gPass" autocomplete="current-password">
    <div id="gPass2W" hidden><label for="gPass2">Repita a senha</label><input type="password" id="gPass2" autocomplete="new-password"></div>
    <div class="status err" id="gErr"></div>
    <button class="btn" id="gGo" type="button" style="width:100%;margin-top:14px;min-height:44px">Entrar</button>
  </div>
</div></div>

<dialog id="askDlg"><div class="dlg"><p id="aMsg" style="margin:0 0 10px;font-size:1.05em"></p><input type="text" id="aIn" hidden><div class="actions"><button class="btn ghost" id="aNo" type="button">Cancelar</button><button class="btn" id="aOk" type="button">OK</button></div></div></dialog>

<dialog id="ncDlg"><div class="dlg">
  <h3>Nova categoria</h3>
  <label for="ncIcon">Ícone (emoji)</label><input type="text" id="ncIcon" maxlength="4">
  <label for="ncName">Nome</label><input type="text" id="ncName" maxlength="60">
  <label for="ncDesc">Descrição</label><input type="text" id="ncDesc" maxlength="100">
  <div class="status" id="ncSt"></div>
  <div class="actions"><button class="btn ghost" id="ncCancel" type="button">Cancelar</button><button class="btn" id="ncSave" type="button">Criar</button></div>
</div></dialog>

<dialog id="uploadDlg"><div class="dlg">
  <h3>Adicionar novo vídeo tutorial</h3>
  <label for="uTitle">Título</label><input type="text" id="uTitle" maxlength="120" placeholder="Ex.: Como emitir uma NF-e">
  <label for="uCat">Categoria</label><select id="uCat"></select>
  <label for="uDesc">Descrição (opcional)</label><textarea id="uDesc" maxlength="500"></textarea>
  <label for="uUrl">Link do vídeo (YouTube ou Google Drive)</label><input type="url" id="uUrl" placeholder="https://www.youtube.com/watch?v=... ou https://drive.google.com/file/d/...">
  <div class="status" id="uStatus"></div>
  <div class="actions"><button class="btn ghost" id="uCancel" type="button">Cancelar</button><button class="btn" id="uSend" type="button">Salvar</button></div>
</div></dialog>

<dialog id="viewDlg"><div class="dlg">
  <h3 id="vTitle"></h3>
  <div class="video-frame" id="vFrameWrap" hidden><iframe id="vFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <video id="vVideo" controls playsinline hidden></video>
  <p id="vDesc" class="status"></p>
  <div class="actions"><button class="btn danger" id="vDel" type="button" hidden>Excluir</button><button class="btn ghost" id="vClose" type="button">Fechar</button></div>
</div></dialog>

<dialog id="cfgDlg"><div class="dlg">
  <h3>Configurações do site</h3>
  <div class="tabs">
    <button class="btn ghost on" id="tabA" type="button">Aparência</button>
    <button class="btn ghost" id="tabB" type="button">Textos</button>
    <button class="btn ghost" id="tabC" type="button">Categorias</button>
    <button class="btn ghost" id="tabD" type="button">Usuários</button>
  </div>
  <div id="paneA">
    <div class="grid2">
      <div><label for="sNavy">Cor do cabeçalho</label><input type="color" id="sNavy"></div>
      <div><label for="sAccent">Cor de destaque</label><input type="color" id="sAccent"></div>
      <div><label for="sFont">Fonte</label><select id="sFont">
        <option value="Arial,Helvetica,sans-serif">Arial</option><option value="Verdana,Geneva,sans-serif">Verdana</option><option value="'Trebuchet MS',sans-serif">Trebuchet</option><option value="Georgia,serif">Georgia</option><option value="'Times New Roman',serif">Times New Roman</option><option value="'Courier New',monospace">Courier New</option><option value="system-ui,sans-serif">Padrão do sistema</option></select></div>
      <div><label for="sTheme">Tema</label><select id="sTheme"><option value="dark">Escuro</option><option value="light">Claro</option><option value="auto">Automático</option></select></div>
      <div><label for="sSize">Tamanho da letra: <span id="sSizeV"></span>px</label><input type="range" id="sSize" min="12" max="18" step="1" style="width:100%;height:36px"></div>
      <div><label for="sRadius">Arredondamento: <span id="sRadiusV"></span>px</label><input type="range" id="sRadius" min="0" max="20" step="1" style="width:100%;height:36px"></div>
    </div>
  </div>
  <div id="paneB" hidden>
    <label for="sLogo">Símbolo do logo (letra ou emoji)</label><input type="text" id="sLogo" maxlength="4">
    <label for="sName">Nome da empresa</label><input type="text" id="sName" maxlength="60">
    <label for="sSub">Subtítulo</label><input type="text" id="sSub" maxlength="60">
    <label for="sH1">Título principal</label><input type="text" id="sH1" maxlength="100">
    <label for="sP">Texto de apoio</label><input type="text" id="sP" maxlength="160">
    <label for="sFoot">Rodapé</label><input type="text" id="sFoot" maxlength="160">
  </div>
  <div id="paneC" hidden>
    <div id="catEdit"></div>
    <div class="actions" style="justify-content:flex-start"><button class="btn ghost small" id="catAdd" type="button">+ Nova categoria</button></div>
    <div class="status">Ao renomear uma categoria, os vídeos dela são atualizados junto.</div>
  </div>
  <div id="paneD" hidden>
    <div id="userList"></div>
    <h3 style="margin:16px 0 0;font-size:1em">Novo usuário</h3>
    <div class="grid2">
      <div><label for="usU">Usuário (sem espaços)</label><input type="text" id="usU" maxlength="30" autocomplete="off"></div>
      <div><label for="usN">Nome</label><input type="text" id="usN" maxlength="60"></div>
      <div><label for="usP">Senha (mínimo 6)</label><input type="text" id="usP" maxlength="60" autocomplete="off"></div>
    </div>
    <div class="actions" style="justify-content:flex-start"><button class="btn small" id="usAdd" type="button">Criar usuário</button></div>
    <div class="status" id="usSt"></div>
  </div>
  <div class="status" id="cStatus"></div>
  <div class="actions"><button class="btn ghost" id="cReset" type="button">Restaurar padrão</button><button class="btn ghost" id="cCancel" type="button">Cancelar</button><button class="btn" id="cSave" type="button">Salvar</button></div>
</div></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {
  getFirestore,
  doc as fsDoc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  collection as fsCol,
  addDoc,
  getDocs,
  query,
  orderBy as fsOrderBy,
  limit as fsLimit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAveplwP25G6au-wMLWXQfsjoep-25tmDM",
  authDomain: "central-de-tutoriais.firebaseapp.com",
  projectId: "central-de-tutoriais",
  storageBucket: "central-de-tutoriais.firebasestorage.app",
  messagingSenderId: "821712169224",
  appId: "1:821712169224:web:77308effca3d7dbb8d64bd",
  measurementId: "G-5YM57E9MQV"
};

const app = initializeApp(firebaseConfig);
const firestore = getFirestore(app);

const $=id=>document.getElementById(id);
const DEF={name:"FAMA INFORMÁTICA",sub:"CENTRAL DE TUTORIAIS",h1:"Aprenda a utilizar seu sistema",p:"Encontre tutoriais e soluções para suas dúvidas.",footer:"Fama Informática • Suporte e treinamento para nossos clientes",logo:"▣",navy:"#15385f",accent:"#1685ed",font:"Arial,Helvetica,sans-serif",size:14,radius:8,theme:"dark"};
const DEFCATS=[["🖥️","Sistema SCE","Instalação e utilização"],["📄","Notas fiscais","NF-e e NFC-e"],["💾","Backup","Cópias e restauração"],["📦","Cadastros","Produtos e clientes"],["💰","Financeiro","Contas e pagamentos"],["❓","Dúvidas frequentes","Problemas e soluções"]].map((c,i)=>({id:"d"+i,icon:c[0],name:c[1],desc:c[2],order:i,isDefault:true}));

function createFirestoreAdapter(){
  const wrapDoc=(ref)=>({
    async get(){
      const snap=await getDoc(ref);
      return {exists:snap.exists(),data:()=>snap.data()||{}};
    },
    async set(val){
      await setDoc(ref,val);
    },
    async update(val){
      await updateDoc(ref,val);
    },
    async delete(){
      await deleteDoc(ref);
    }
  });
  return {
    doc(path){
      return wrapDoc(fsDoc(firestore,path));
    },
    collection(colName){
      const colRef=fsCol(firestore,colName);
      return {
        async add(val){
          const r=await addDoc(colRef,val);
          return {id:r.id};
        },
        doc(id){
          return wrapDoc(fsDoc(firestore,colName,id));
        },
        limit(n){
          return {
            async get(){
              const snap=await getDocs(query(colRef,fsLimit(n)));
              return {size:snap.size};
            }
          };
        },
        orderBy(field,dir="asc"){
          return {
            onSnapshot(cb,errCb){
              const q=query(colRef,fsOrderBy(field,dir));
              return onSnapshot(q,(snap)=>{
                cb({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()}))});
              },errCb);
            }
          };
        }
      };
    }
  };
}

function extrairMidia(urlRaw){
  const url=(urlRaw||"").trim();
  const ytMatch=url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if(ytMatch&&ytMatch[1]){
    return {provedor:"youtube",midiaId:ytMatch[1],embedUrl:`https://www.youtube.com/embed/${encodeURIComponent(ytMatch[1])}`};
  }
  const drivePath=url.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
  if(drivePath&&drivePath[1]){
    return {provedor:"drive",midiaId:drivePath[1],embedUrl:`https://drive.google.com/file/d/${encodeURIComponent(drivePath[1])}/preview`};
  }
  const driveQuery=url.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(url.includes("drive.google.com")&&driveQuery&&driveQuery[1]){
    return {provedor:"drive",midiaId:driveQuery[1],embedUrl:`https://drive.google.com/file/d/${encodeURIComponent(driveQuery[1])}/preview`};
  }
  if(/^https?:\/\/.+\.(mp4|webm|ogg)(\?.*)?$/i.test(url)){
    return {provedor:"direct",midiaId:"",embedUrl:url};
  }
  return null;
}

    if(hadDefaultOnly){
      for(const dc of DEFCATS){
        await db.collection("categories").doc("c"+dc.order+Date.now()).set({name:dc.name,desc:dc.desc,icon:dc.icon,order:dc.order});
      }
    }
    for(const rid of removed){
      await db.collection("categories").doc(rid).delete();
    }
    for(const c of validDraft){
      if(c.origName&&c.origName!==c.name){
        const affected=items.filter(t=>t.category===c.origName);
        for(const t of affected){
          await db.collection("tutorials").doc(t.id).update({category:c.name});
        }
      }
      if(c.id&&!c.isDefault){
        await db.collection("categories").doc(c.id).update({icon:c.icon,name:c.name,desc:c.desc,order:c.order});
      }else{
        await db.collection("categories").add({icon:c.icon,name:c.name,desc:c.desc,order:c.order});
      }
    }
    st.textContent="Configurações salvas.";
    setTimeout(()=>$("cfgDlg").close(),250);
  }catch(e){
    st.className="status err";
    st.textContent="Erro ao salvar"+((e&&e.message)?": "+e.message:".");
  }
  $("cSave").disabled=false;
});

applySettings();
route();
renderCats();
authInit();
</script>
</body>
</html>
